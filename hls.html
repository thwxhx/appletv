<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Live Player</title>
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.12/dist/hls.min.js"></script>
  <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
  <style>
    :root { --plyr-color-main: #00b2ff; }
    html, body { margin: 0; padding: 0; background: #0d0c0c; height: 100%; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 10px; }
    video { width: 100%; }
    #msg { color: #ffb4b4; font: 14px sans-serif; text-align: center; padding: 8px; display: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <video id="player" controls playsinline></video>
    <div id="msg"></div>
  </div>

  <script>
    // Default stream. Override with ?url=OTHER_M3U8 if you like.
    const DEFAULT_URL = 'https://live2.jorvakstreamcache.com/live/channel12.m3u8';
    const src = new URLSearchParams(location.search).get('url') || DEFAULT_URL;

    const video = document.getElementById('player');
    const msg = document.getElementById('msg');
    const showError = t => { msg.textContent = t; msg.style.display = 'block'; };

    if (window.Hls && Hls.isSupported()) {
      const hls = new Hls({
        enableWorker: true,
        liveSyncDurationCount: 3,
        liveMaxLatencyDurationCount: 10
      });
      hls.loadSource(src);
      hls.attachMedia(video);

      let retries = 0;
      hls.on(Hls.Events.ERROR, (e, data) => {
        if (!data.fatal) return;
        if (data.type === Hls.ErrorTypes.NETWORK_ERROR && retries++ < 5) {
          hls.startLoad();
        } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
          hls.recoverMediaError();
        } else {
          showError('Stream failed to load. It may be offline or blocking this site.');
          hls.destroy();
        }
      });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = src; // Safari / iOS native HLS
    } else {
      showError('This browser cannot play HLS streams.');
    }

    const player = new Plyr(video, {
      controls: ['play-large', 'play', 'current-time', 'mute', 'volume', 'settings', 'pip', 'fullscreen']
    });
    player.on('ready', () => player.play().catch(() => {}));
  </script>
</body>
</html>
